services:
  db:
    image: postgres:16
    container_name: fbyahoo
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fbyahoo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fbyahoo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: fbyahoo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fb_helper_app
    restart: unless-stopped
    environment:
      # Database connection (using docker service name)
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fbyahoo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      # Yahoo OAuth
      YAHOO_CLIENT_ID: ${YAHOO_CLIENT_ID}
      YAHOO_CLIENT_SECRET: ${YAHOO_CLIENT_SECRET}
      YAHOO_REDIRECT_URI: ${YAHOO_REDIRECT_URI:-https://localhost:8443/oauth/yahoo/callback}

      # SSL
      SSL_KEYSTORE_PATH: file:/app/secrets/keystore.p12
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:-}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Spring Boot
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8443:8443"
    volumes:
      # Mount secrets directory for SSL certificates
      - ./secrets:/app/secrets:ro

volumes:
  pgdata:
